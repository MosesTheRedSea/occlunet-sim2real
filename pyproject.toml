[project]
name = "occulnet-sim2real"
version = "0.1.0"
description = "Simulation-to-real transfer for acoustic perception of occluded objects"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyroomacoustics>=0.7",
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchvision>=0.17",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "open3d>=0.18",
    "pandas>=2.2",
    "h5py>=3.10",
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12"
]


[tool.setuptools]
packages = [
    "simulation",
    "recording",
    "preprocessing",
    "models",
    "training",
    "evaluation",
    "src"
]